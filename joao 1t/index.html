
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo com PyScript</title>
    
    <!-- CSS do PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    
    <!-- Seu arquivo CSS separado -->
    <link rel="stylesheet" href="./style.css">

    <!-- JS do PyScript -->
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
</head>
<body>

    <!-- Mensagem de boas-vindas -->
    <h2 id="mensagem">Carregando jogo...</h2>

    <!-- Alvo para clicar -->
    <div id="alvo">CLIQUE!</div>

    <!-- Placar de pontuação -->
    <h3>Pontos: <span id="pontos">0</span></h3>

    <!-- Integração do arquivo Python separado -->
    <script type="py" src="./app.py"></script>

</body>
</html>
